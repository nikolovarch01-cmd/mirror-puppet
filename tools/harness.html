<!doctype html><title>harness</title>
<iframe id="f" src="/mirror-puppet.html" width="1300" height="720" allow="camera *; microphone *" style="border:0"></iframe>
<script>
const log = (...a) => console.log('HARNESS', ...a);
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function post(name, dataUrl) { const r = await fetch('/save/' + name, { method: 'POST', body: dataUrl }); log('saved', name, r.status); }
function synth(st) {
  const A = st.H / st.W;
  const P = (x, y, z = 0, visibility = 1) => ({ x, y, z, visibility });
  const pose = Array.from({ length: 33 }, () => P(0.5, 0.5, 0, 0));
  const set = (i, x, y, z = 0) => { pose[i] = P(x, y, z, 1); };
  set(0, 0.5, 0.28); set(2, 0.48, 0.26); set(5, 0.52, 0.26); set(7, 0.455, 0.28); set(8, 0.545, 0.28);
  set(11, 0.62, 0.45); set(12, 0.38, 0.45); set(13, 0.70, 0.62); set(14, 0.30, 0.62); set(15, 0.72, 0.40, -0.2); set(16, 0.28, 0.40, -0.2);
  set(23, 0.58, 0.80); set(24, 0.42, 0.80); set(25, 0.60, 1.05); set(26, 0.40, 1.05); set(27, 0.60, 1.30); set(28, 0.40, 1.30);
  set(29, 0.60, 1.32, .025); set(30, 0.40, 1.32, .025); set(31, .62, 1.33, -.10); set(32, .38, 1.33, -.10);
  const K = 1.5, hx = 0.5, hy = 0.80;
  const poseWorld = pose.map(p => ({ x: (p.x - hx) * K, y: (p.y - hy) * A * K, z: p.z * K, visibility: p.visibility }));
  function hand(wx, wy, dir) {
    const img = [P(wx, wy, 0)];
    const fingers = [[-1.0, 3], [-0.5, 4], [-0.15, 4], [0.2, 4], [0.55, 3]];
    for (const [ang, n] of fingers) for (let j = 1; j <= 4; j++) {
      const L = j <= n ? j * 0.028 : n * 0.028;
      img.push(P(wx + Math.cos(dir + ang) * L, wy + Math.sin(dir + ang) * L / A, -0.01 * j));
    }
    const world = img.map(p => ({ x: (p.x - wx) * K, y: (p.y - wy) * A * K, z: p.z * K, visibility: 1 }));
    return { img, world };
  }
  const hL = hand(0.72, 0.40, -Math.PI / 2 - 0.3), hR = hand(0.28, 0.40, -Math.PI / 2 + 0.3);
  const cx = 0.5, cy = 0.28, face = [];
  for (let i = 0; i < 478; i++) {
    const t = i * 2.399963, r = Math.sqrt((i + 0.5) / 478);
    face.push(P(cx + r * Math.cos(t) * 0.04, cy + r * Math.sin(t) * 0.05 / A, -0.035 * (1 - r * r)));
  }
  face[1] = P(cx, cy, -0.045); face[4] = P(cx, cy + 0.005, -0.043);
  face[468] = P(cx - 0.02, cy - 0.015 / A, -0.02); face[473] = P(cx + 0.02, cy - 0.015 / A, -0.02);
  face[152] = P(cx, cy + 0.05 / A, -0.01); face[10] = P(cx, cy - 0.05 / A, -0.01);
  const blend = [['jawOpen', 0.72], ['mouthSmileLeft', 0.55], ['mouthSmileRight', 0.5], ['browInnerUp', 0.3], ['eyeBlinkRight', 0.12], ['cheekPuff', 0.05], ['_neutral', 0]].map(([categoryName, score]) => ({ categoryName, score, index: 0, displayName: '' }));
  return { face, blend, pose, poseWorld, hands: [{ side: 'L', attached: true, img: hL.img, world: hL.world }, { side: 'R', attached: true, img: hR.img, world: hR.world }] };
}
(async () => {
  const w = document.getElementById('f').contentWindow;
  for (let i = 0; i < 240 && !(w.mirrorPuppet && w.mirrorPuppet.backend); i++) await sleep(250);
  const mp = w.mirrorPuppet;
  log('app ready', !!mp, 'engine', mp && mp.backend && mp.backend.key, 'running', mp.state.running, mp.state.W + 'x' + mp.state.H);
  await sleep(2500);
  log('status', w.document.getElementById('status').textContent);
  log('loading hidden', w.document.getElementById('loading').classList.contains('hidden'));
  // the modules must all arrive with the same ?v= stamp (import map) -- otherwise a phone can mix old and new files
  const mods = w.performance.getEntriesByType('resource').map(e => e.name).filter(n => /\/js\/[\w-]+\.js/.test(n)).map(n => n.split('/js/')[1]);
  const stamps = new Set(mods.map(n => (n.split('?v=')[1] || 'NONE')));
  const mapped = Object.keys(JSON.parse(w.document.querySelector('script[type=importmap]').textContent).imports).filter(k => k.startsWith('./js/')).length;
  log('modules', mods.length, 'of', mapped, 'in the import map', 'stamps', [...stamps].join(','), 'build', mp.build, 'label', w.document.getElementById('build').textContent, (mods.length === mapped && stamps.size === 1 && !stamps.has('NONE')) ? 'OK' : 'ERROR stamp mismatch');
  mp.stopCamera();
  const res = synth(mp.state);
  for (let i = 0; i < 25; i++) { mp.present(res); await sleep(30); }
  const c = mp.canvases();
  const s = mp.scene; let visible = []; s.traverse(o => { if (o.visible && (o.isMesh || o.isLineSegments || o.isPoints)) visible.push(o.type); });
  log('visible objects', visible.length, 'chips', [...w.document.querySelectorAll('.chip.on')].map(e => e.textContent).join(','), 'bars', [...w.document.querySelectorAll('#bsList .bs .n')].map(e => e.textContent).filter(Boolean).join(' | '));
  // the Performance panel: a summary line while closed, rows with bars when opened
  await sleep(1100);
  log('monitor closed:', w.document.getElementById('perfTitle').textContent, '| rows', [...mp.mon.rows.keys()].join(','), '| gpu', mp.mon.gpu.name || '-', '| timer query', mp.mon.gpu.ext ? 'yes' : 'no');
  w.document.getElementById('perfTitle').click();
  log('monitor open:', [...w.document.querySelectorAll('#perfList .bs')].map(e => e.children[0].textContent + ' = ' + e.children[1].textContent).join(' | '), (w.document.querySelectorAll('#perfList .bs').length >= 3 && mp.mon.rows.has('main')) ? 'OK' : 'ERROR monitor empty');
  w.document.getElementById('perfTitle').click();
  mp.renderer.render(mp.scene, mp.camera);
  await post('three.png', c.three.toDataURL('image/png'));
  await post('overlay.png', c.overlay.toDataURL('image/png'));
  // second view: orbit the camera a little to the side and re-render
  mp.camera.position.set(1.2, 0.5, 1.4); mp.camera.lookAt(0, 0.1, 0); mp.renderer.render(mp.scene, mp.camera);
  await post('three-side.png', c.three.toDataURL('image/png'));
  log('DONE');
})().catch(e => log('ERROR', String(e), e && e.stack));
</script>
