<!doctype html><title>threads harness</title>
<iframe id="f" src="/mirror-puppet.html" width="1300" height="720" allow="camera *; microphone *" style="border:0"></iframe>
<script>
// Recognition in worker threads: the automatic engine follows this machine's plan (threadPlan: 8+ cores and not a
// phone -> 3 threads, 2+ -> 1, else main thread), results flow back (fps > 0 on the fake camera, empty results are
// still results), the Performance panel has a row per thread with steady-state times after the shader warm-up, the
// Threads menu rebuilds the engine (off -> main thread, 1 -> one thread, auto -> the plan), and two quick changes
// of the menu without waiting end with the LAST choice (the engine builds carry a generation number).
const log = (...a) => console.log('HARNESS', ...a);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rows = mp => [...mp.mon.rows].map(([n, r]) => n + ' ' + r.pct + '% ' + Math.round(r.last) + ' ms').join(' | ');
const namesFor = n => n >= 3 ? ['face thread', 'hands thread', 'body thread'] : n === 1 ? ['recognition thread'] : [];
async function until(cond, tries) { for (let i = 0; i < tries && !cond(); i++) await sleep(250); return cond(); }
(async () => {
  const w = document.getElementById('f').contentWindow;
  await until(() => w.mirrorPuppet && w.mirrorPuppet.backend, 240);
  const mp = w.mirrorPuppet, b = mp.backend, N = mp.threadPlan();
  log('THREADS plan for this machine', N, '| cores', mp.mon.cores, '| engine', b.key, '| label', b.label, '| threads', b.threads,
      '| workers', (b.workers || []).map(x => x.name + ':' + x.delegate + (x.gl ? ':gl' : ':no-gl')).join(', '));
  if (N === 0) { log('THREADS skipped: no worker threads on this device'); log('DONE'); return; }
  log('THREADS automatic engine follows the plan:', b.key === 'threads:GPU' && b.threads === N ? 'OK' : 'ERROR expected threads:GPU with ' + N + ' thread(s)');
  await sleep(9000);   // the first detections of a GPU task compile shaders; read a steady second
  const st = w.document.getElementById('status').textContent;
  log('THREADS after 9 s: status', st, '| rows', rows(mp));
  const fps = +(st.match(/(\d+) fps/) || [0, 0])[1];
  log('THREADS results flowing: fps', fps, fps > 0 ? 'OK' : 'ERROR no frames presented');
  // the 3D view is drawn on demand: about as often as a new pose arrives, never 60 times a second
  log('THREADS 3D view drawn per second', mp.mon.rendersPerSec, 'at', fps, 'fps', (mp.mon.rendersPerSec <= fps + 4 && mp.mon.rendersPerSec >= 1) ? 'OK' : 'ERROR redraw rate is not tied to the pose rate');
  const missing = namesFor(N).filter(n => !mp.mon.rows.has(n));
  log('THREADS panel rows for the threads:', namesFor(N).length - missing.length, 'of', namesFor(N).length, missing.length ? 'ERROR missing ' + missing.join(', ') : 'OK');
  // Threads off: the engine is rebuilt on the main thread
  const sel = w.document.getElementById('optThreads');
  sel.value = '0'; sel.onchange();
  await until(() => mp.backend && mp.backend.key === 'sep:GPU', 240);
  log('THREADS off -> engine', mp.backend && mp.backend.key, mp.backend && mp.backend.key === 'sep:GPU' ? 'OK' : 'ERROR main-thread engine expected');
  await sleep(2500);
  log('THREADS main thread only:', w.document.getElementById('status').textContent, '| rows', rows(mp));
  // one thread with all three models
  sel.value = '1'; sel.onchange();
  await until(() => mp.backend && mp.backend.key === 'threads:GPU' && mp.backend.threads === 1, 240);
  log('THREADS 1 -> engine', mp.backend && mp.backend.label, mp.backend && mp.backend.threads === 1 ? 'OK' : 'ERROR one thread expected');
  await sleep(6000);
  log('THREADS one thread:', w.document.getElementById('status').textContent, '| rows', rows(mp));
  // two quick changes without waiting: 3 then auto -- the last one must win, whatever finishes first
  sel.value = '3'; sel.onchange();
  await sleep(300);
  sel.value = 'auto'; sel.onchange();
  await until(() => mp.backend && mp.backend.key === 'threads:GPU' && mp.backend.threads === N, 360);
  await sleep(3000);   // a slower older build finishing later must not replace it
  log('THREADS 3 then auto without waiting -> engine', mp.backend && mp.backend.label, '| threads', mp.backend && mp.backend.threads,
      mp.backend && mp.backend.threads === N && mp.backend.key === 'threads:GPU' ? 'OK' : 'ERROR the last choice did not win');
  log('DONE');
})().catch(e => log('ERROR', String(e), e && e.stack));
</script>
