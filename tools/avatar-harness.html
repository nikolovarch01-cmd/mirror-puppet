<!doctype html><meta name="viewport" content="width=device-width, initial-scale=1"><title>avatar harness</title>
<iframe id="f" src="/mirror-puppet.html" width="1300" height="720" allow="camera *; microphone *" style="border:0"></iframe>
<script>
const log = (...a) => console.log('HARNESS', ...a);
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function post(name, dataUrl) { const r = await fetch('/save/' + name, { method: 'POST', body: dataUrl }); log('saved', name, r.status); }
function synth(st) {
  const A = st.H / st.W;
  const P = (x, y, z = 0, visibility = 1) => ({ x, y, z, visibility });
  const pose = Array.from({ length: 33 }, () => P(0.5, 0.5, 0, 0));
  const set = (i, x, y, z = 0) => { pose[i] = P(x, y, z, 1); };
  set(0, 0.5, 0.28); set(2, 0.48, 0.26); set(5, 0.52, 0.26); set(7, 0.455, 0.28); set(8, 0.545, 0.28);
  set(11, 0.62, 0.45); set(12, 0.38, 0.45); set(13, 0.70, 0.62); set(14, 0.30, 0.62); set(15, 0.72, 0.40, -0.2); set(16, 0.28, 0.40, -0.2);
  set(23, 0.58, 0.80); set(24, 0.42, 0.80); set(25, 0.60, 1.05); set(26, 0.40, 1.05); set(27, 0.60, 1.30); set(28, 0.40, 1.30);
  set(29, 0.60, 1.32, .025); set(30, 0.40, 1.32, .025); set(31, .62, 1.33, -.10); set(32, .38, 1.33, -.10);
  const K = 1.5, hx = 0.5, hy = 0.80;
  const poseWorld = pose.map(p => ({ x: (p.x - hx) * K, y: (p.y - hy) * A * K, z: p.z * K, visibility: p.visibility }));
  function hand(wx, wy, dir) {
    const img = [P(wx, wy, 0)];
    const fingers = [[-1.0, 3], [-0.5, 4], [-0.15, 4], [0.2, 4], [0.55, 3]];
    for (const [ang, n] of fingers) for (let j = 1; j <= 4; j++) {
      const L = j <= n ? j * 0.028 : n * 0.028;
      img.push(P(wx + Math.cos(dir + ang) * L, wy + Math.sin(dir + ang) * L / A, -0.01 * j));
    }
    const world = img.map(p => ({ x: (p.x - wx) * K, y: (p.y - wy) * A * K, z: p.z * K, visibility: 1 }));
    return { img, world };
  }
  const hL = hand(0.72, 0.40, -Math.PI / 2 - 0.3), hR = hand(0.28, 0.40, -Math.PI / 2 + 0.3);
  const cx = 0.5, cy = 0.28, face = [];
  for (let i = 0; i < 478; i++) {
    const t = i * 2.399963, r = Math.sqrt((i + 0.5) / 478);
    face.push(P(cx + r * Math.cos(t) * 0.04, cy + r * Math.sin(t) * 0.05 / A, -0.035 * (1 - r * r)));
  }
  face[1] = P(cx, cy, -0.045); face[4] = P(cx, cy + 0.005, -0.043);
  face[468] = P(cx - 0.02, cy - 0.015 / A, -0.02); face[473] = P(cx + 0.02, cy - 0.015 / A, -0.02);
  face[152] = P(cx, cy + 0.05 / A, -0.01); face[10] = P(cx, cy - 0.05 / A, -0.01);
  const blend = [['jawOpen', 0.72], ['mouthSmileLeft', 0.55], ['mouthSmileRight', 0.5], ['browInnerUp', 0.3], ['eyeBlinkRight', 0.12], ['cheekPuff', 0.05], ['_neutral', 0]].map(([categoryName, score]) => ({ categoryName, score, index: 0, displayName: '' }));
  return { face, blend, pose, poseWorld, hands: [{ side: 'L', attached: true, img: hL.img, world: hL.world }, { side: 'R', attached: true, img: hR.img, world: hR.world }] };
}

window.avatarTest={done:false,checks:[]};
const check=(ok,name)=>{if(!ok)throw new Error(name);window.avatarTest.checks.push(name);log('PASS',name);};
(async()=>{
  const phone=new URLSearchParams(location.search).has('phone');
  const f=document.getElementById('f');if(phone){f.width=390;f.height=760;document.body.style.margin='0';}
  const w=f.contentWindow;
  for(let i=0;i<360 && !(w.mirrorPuppet?.backend);i++)await sleep(250);
  const mp=w.mirrorPuppet;check(!!mp?.backend,'recognition engine ready');
  await sleep(2000);mp.stopCamera();
  // A sandbox may have no capture service. Close the existing camera card for visual QA only.
  const close=[...w.document.querySelectorAll('#loading button')].find(b=>b.textContent==='Close');if(close)close.click();
  const doc=w.document,res=synth(mp.state);
  const P=(x,y,z=0)=>({x,y,z});
  res.face[234]=P(.46,.28,-.01);res.face[454]=P(.54,.28,-.01);
  for(let i=0;i<25;i++)mp.present(res);
  check([...doc.querySelectorAll('.chip.on')].length===4,'legacy face/body/hands');
  check(['Spine02','Spine01','Waist'].every(n=>mp.scene.getObjectByName('Guide_CC_Base_'+n)?.visible),'rig-proportioned spine guides');
  mp.renderer.render(mp.scene,mp.camera);await post('avatar-legacy.png',mp.renderer.domElement.toDataURL());
  const overlayBefore=mp.canvases().overlay.toDataURL();
  doc.getElementById('avatarMode').value='character';await mp.loadAvatar();
  check(overlayBefore===mp.canvases().overlay.toDataURL(),'2D overlay unchanged');
  if(phone){doc.getElementById('btnView').click();await sleep(200);}
  for(let i=0;i<25;i++)mp.present(res);
  check(mp.avatar.bones.size===101,'101 rig bones loaded');
  check(mp.avatar.tracked,'character tracking');
  const b=name=>mp.avatar.bones.get('CC_Base_'+name);
  const v=b('Hip').position.clone();
  const world=name=>b(name).getWorldPosition(v.clone());
  const align=(name,end,i,j)=>{
    const actual=world(end).sub(world(name)).normalize(),a=res.poseWorld[i],c=res.poseWorld[j];
    const expected=v.clone().set((mp.state.mirror?-1:1)*(c.x-a.x),-(c.y-a.y),-(c.z-a.z)).normalize();
    check(actual.dot(expected)>.995,'direction '+name);
  };
  align('L_Upperarm','L_Forearm',11,13);align('R_Upperarm','R_Forearm',12,14);
  align('L_Forearm','L_Hand',13,15);align('R_Forearm','R_Hand',14,16);
  align('L_Thigh','L_Calf',23,25);align('R_Thigh','R_Calf',24,26);
  align('L_Foot','L_ToeBase',27,31);align('R_Foot','R_ToeBase',28,32);
  let meshes=0;
  mp.avatar.root.traverse(o=>{if(o.isSkinnedMesh){meshes++;o.skeleton.update();
    const pos=o.geometry.attributes.position;
    for(let i=0;i<pos.count;i+=97){const p=v.clone().fromBufferAttribute(pos,i);o.applyBoneTransform(i,p);checkFinite(p);}
  }});
  function checkFinite(p){if(![p.x,p.y,p.z].every(Number.isFinite))throw new Error('nonfinite skinned vertex');}
  check(meshes===1,'one skinned material mesh, finite deformed vertices');
  mp.renderer.render(mp.scene,mp.camera);await post(phone?'avatar-mobile-character.png':'avatar-character.png',mp.renderer.domElement.toDataURL());
  if(!phone){mp.camera.position.set(1.7,.4,2.6);mp.camera.lookAt(0,.1,0);mp.renderer.render(mp.scene,mp.camera);await post('avatar-character-side.png',mp.renderer.domElement.toDataURL());}
  const qBefore=b('L_Upperarm').quaternion.clone();
  const moved=structuredClone(res);moved.poseWorld[13].x+=.2;moved.pose[13].x+=.1;
  for(let i=0;i<25;i++)mp.present(moved);
  check(qBefore.angleTo(b('L_Upperarm').quaternion)>.05,'arm responds to changed target');
  const hq=b('L_Index1').quaternion.clone(),fingers=structuredClone(res);
  fingers.hands[0].world[6].x+=.12;
  for(let i=0;i<25;i++)mp.present(fingers);
  check(hq.angleTo(b('L_Index1').quaternion)>.05,'finger responds to changed target');
  const headOnly={...res,pose:null,poseWorld:null};for(let i=0;i<25;i++)mp.present(headOnly);
  check(mp.avatar.tracked,'head/hands without visible hips');
  doc.getElementById('optMirror').checked=false;doc.getElementById('optMirror').dispatchEvent(new w.Event('change'));
  for(let i=0;i<25;i++)mp.present(res);align('L_Upperarm','L_Forearm',11,13);
  check(mp.avatar.root.scale.x>0,'unmirrored character');
  doc.getElementById('optMirror').checked=true;doc.getElementById('optMirror').dispatchEvent(new w.Event('change'));
  mp.present({face:null,blend:null,pose:null,poseWorld:null,hands:[]});
  check(!mp.avatar.tracked,'lost detection returns to rest pose');
  doc.getElementById('avatarRest').click();check(!mp.state.running,'rest pose stops camera');
  if(phone){
    check(w.getComputedStyle(doc.getElementById('cam')).display==='none','phone shows only puppet');
    doc.getElementById('btnView').click();await sleep(100);
    check(w.getComputedStyle(doc.getElementById('view3d')).display==='none','phone shows only camera');
    check(w.getComputedStyle(doc.getElementById('video')).objectFit==='contain','camera never cropped');
    check(!doc.getElementById('expr').classList.contains('open'),'expressions closed by default');
    check(doc.documentElement.scrollWidth<=390,'no horizontal overflow');
  }
  doc.getElementById('avatarMode').value='skeleton';await doc.getElementById('avatarMode').onchange();
  for(let i=0;i<25;i++)mp.present(res);
  check(!mp.avatar.root.visible && [...doc.querySelectorAll('.chip.on')].length===4,'switch back to working skeleton');
  window.avatarTest.done=true;log('AVATAR_DONE',window.avatarTest.checks.length);
})().catch(e=>{window.avatarTest.error=e.message;window.avatarTest.done=true;log('AVATAR_ERROR',e.message,e.stack);});
</script>
