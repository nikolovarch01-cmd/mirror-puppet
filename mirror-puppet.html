<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirror Puppet</title>
<style>
:root{--bg:#0f1317;--panel:#161c22;--line:#2a333d;--text:#e6edf3;--muted:#8b9aab;--acc:#5ec8ff;--left:#4fd8ff;--right:#ffb347;--body:#9be29b;--face:#a9d3ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0 6px 0 0;font-weight:600;white-space:nowrap}
header label{display:inline-flex;align-items:center;gap:4px;color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none}
header input[type=checkbox]{accent-color:var(--acc);margin:0}
header input[type=range]{width:80px;accent-color:var(--acc)}
button,select{background:#1f2932;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font:inherit;cursor:pointer}
button:hover,select:hover{border-color:#3d4a57}
button.primary{background:var(--acc);color:#04121c;border-color:transparent;font-weight:600}
#status{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
main{flex:1;display:flex;min-height:0;position:relative}
.pane{flex:1;position:relative;min-width:0;min-height:0;background:#000;overflow:hidden}
.pane+.pane{border-left:1px solid var(--line)}
.picture{position:absolute;inset:0}
.picture video,.picture canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
body.mirror .picture video,body.mirror .picture canvas{transform:scaleX(-1)}
body.novideo .picture video{visibility:hidden}
#view3d canvas{display:block}
.chips{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:2px 8px;border-radius:999px;font-size:12px;background:rgba(15,19,23,.7);color:var(--muted);border:1px solid var(--line)}
.chip.on{color:#04121c;border-color:transparent}
.chip.on.phone{background:#e4e6ea}.chip.on.face{background:var(--face)}.chip.on.body{background:var(--body)}.chip.on.left{background:var(--left)}.chip.on.right{background:var(--right)}
#expr{position:absolute;left:10px;bottom:10px;width:240px;max-width:calc(50% - 15px);background:rgba(15,19,23,.78);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px}
#expr h2{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#expr:not(.open) .bs{display:none}
#expr:not(.open) h2{margin:0}
#perf{position:absolute;right:10px;bottom:10px;width:270px;max-width:calc(50% - 15px);background:rgba(15,19,23,.78);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;z-index:2}
#perf h2{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#perf:not(.open) .bs{display:none}
#perf:not(.open) h2{margin:0}
.bs{display:grid;grid-template-columns:1fr 46px;gap:2px 6px;align-items:center;margin:3px 0}
.bs .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bs .b{grid-column:1/3;height:4px;background:#232c35;border-radius:2px;overflow:hidden}
.bs .b i{display:block;height:100%;background:var(--acc);width:0}
#hint{position:absolute;right:10px;bottom:10px;color:var(--muted);font-size:12px;background:rgba(15,19,23,.6);padding:3px 8px;border-radius:6px;pointer-events:none}
#front{position:absolute;right:10px;top:10px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,19,23,.85);color:var(--text);font-size:15px;text-align:center;padding:20px;z-index:5;line-height:1.6}
#loading.hidden{display:none}
#loading .box{max-width:640px}
#loading .row{margin-top:12px;display:flex;gap:8px;justify-content:center}
#loading small{color:var(--muted);word-break:break-word}
.tools{display:contents}.only-phone{display:none}
@media (max-width:760px){
  body{height:100dvh}
  header{gap:6px 8px;padding:6px 8px}
  header h1{display:none}
  .only-phone{display:inline-block}
  .tools{display:none;width:100%;flex-wrap:wrap;gap:6px 10px;padding-top:4px}
  header.open .tools{display:flex}
  #status{margin-left:0;width:100%;font-size:12px;white-space:normal}
  main{flex-direction:column}
  .pane+.pane{border-left:0}
  body.puppet #cam{display:none}
  body:not(.puppet) #view3d{display:none}
  #cam{display:flex;flex-direction:column;overflow:auto}
  .picture{position:relative;inset:auto;width:100%;flex:0 1 auto;aspect-ratio:var(--ar,16/9);min-height:0}
  #expr{position:static;width:auto;max-width:none;margin:8px;flex:0 0 auto}
  #perf{position:static;width:auto;max-width:none;margin:0 8px 8px;flex:0 0 auto}
  #hint{display:none}
}
body.oncamera #view3d{display:none}
body.oncamera #cam{display:flex}
body.oncamera:not(.guides).character-ready #overlay{visibility:hidden}
.picture canvas.character-canvas,body.mirror .picture canvas.character-canvas{transform:none;pointer-events:none;inset:auto;z-index:1}
.chips{z-index:2}
#expr{z-index:2}
body.oncamera #avatarInfo{top:auto!important;bottom:8px;z-index:2;background:#0f1317bb;padding:3px 8px}
</style>
</head>
<body class="mirror oncamera">
<header>
  <h1>Mirror Puppet</h1>
  <button id="btnCam" class="primary">Start camera</button>
  <button id="btnView" class="only-phone">Puppet</button>
  <button id="btnFlip" class="only-phone" title="Front / back camera">Flip</button>
  <button id="btnTools" class="only-phone">Settings</button>
  <div class="tools">
  <select id="camSel" title="Which camera" hidden></select>
  <label><input type="checkbox" id="optFace" checked> Face</label>
  <label><input type="checkbox" id="optHands" checked> Hands</label>
  <label><input type="checkbox" id="optBody" checked> Body</label>
  <label><input type="checkbox" id="optMesh" checked> Mesh</label>
  <label><input type="checkbox" id="optMirror" checked> Mirror</label>
  <label><input type="checkbox" id="optVideo" checked> Video</label>
  <label>Smoothing <input type="range" id="optSmooth" min="0" max="90" value="50"></label>
  <label>Engine <select id="optEngine">
    <option value="auto">automatic</option>
    <option value="threads:GPU">3 models · threads</option>
    <option value="sep:GPU">3 models · GPU</option>
    <option value="holistic:GPU">combined · GPU</option>
    <option value="sep:CPU">3 models · CPU</option>
    <option value="threads:CPU">3 models · threads · CPU</option>
    <option value="holistic:CPU">combined · CPU</option>
  </select></label>
  <label title="Recognition in worker threads: auto picks by the core count; off = everything on the main thread">Threads <select id="optThreads"><option value="auto" selected>auto</option><option value="3">3</option><option value="1">1</option><option value="0">off</option></select></label>
  <label>Display <select id="avatarMode"><option value="overlay" selected>On camera</option><option value="character">Character 3D</option><option value="skeleton">Skeleton</option></select></label>
  <label><input type="checkbox" id="optGuides"> Guides on camera</label>
  <label>Phone <select id="optPhone" title="A phone in the hand: found automatically, or forced"><option value="auto" selected>auto</option><option value="L">left hand</option><option value="R">right hand</option><option value="off">off</option></select></label>
  <button id="avatarRest" title="Stop camera and inspect the character rest pose">Rest pose</button>
  <button id="btnSnap" title="Saves a picture of both views">Snapshot</button>
  <span style="color:var(--muted);font-size:11px">phone model: aiPhone 15 Pro by hysokana, Sketchfab, CC BY-NC 4.0 · <span id="build"></span></span>
  </div>
  <span id="status">loading…</span>
</header>
<main>
  <section class="pane" id="cam">
    <div class="picture">
      <video id="video" autoplay muted playsinline webkit-playsinline></video>
      <canvas id="overlay" width="640" height="480"></canvas>
      <div class="chips"><span class="chip face" id="chipFace">face</span><span class="chip body" id="chipBody">body</span><span class="chip left" id="chipL">left hand</span><span class="chip right" id="chipR">right hand</span><span class="chip phone" id="chipPhone">phone</span></div>
    </div>
    <div id="expr"><h2 id="exprTitle">Expression</h2><div id="bsList"></div></div>
    <div id="perf" title="What the machine does each second: main thread, recognition threads, video card"><h2 id="perfTitle">Performance</h2><div id="perfList"></div></div>
  </section>
  <section class="pane" id="view3d">
    <div id="avatarInfo" style="position:absolute;left:10px;top:10px;max-width:65%;font-size:12px;color:var(--muted);pointer-events:none">Select Character for the textured model</div>
    <button id="front">Front view</button>
    <div id="hint">drag to rotate · wheel to zoom</div>
  </section>
  <div id="loading"><div class="box">Loading the recognition models…<br><small id="prog">checking this device</small></div></div>
</main>

</body>
</html>
